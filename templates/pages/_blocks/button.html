{% set label = i18n_value(block.data.label, current_lang) %}
{% if block.data.url or (edit_mode is defined and edit_mode) %}
<p class="block-button-wrap">
    <a href="{{ block.data.url or '#' }}" class="btn btn-{{ 'primary' if block.data.style == 'primary' else 'secondary' }}">{{ label or 'Meer info' }}</a>
</p>
{% endif %}
