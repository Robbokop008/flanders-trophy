{% set embed_url = video_embed_url(block.data.provider, block.data.embed_id) %}
{% if embed_url %}
<div class="block-video-wrap">
    <iframe src="{{ embed_url }}" title="Video" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
</div>
{% elif edit_mode is defined and edit_mode %}
<div class="canvas-placeholder-box">Nog geen video ingesteld</div>
{% endif %}
