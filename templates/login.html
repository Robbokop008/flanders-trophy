{% extends "base.html" %}

{% block title %}Flanders Trophy | Login{% endblock %}

{% block content %}
<section class="club-hero">
    <h1>Admin-login</h1>
    <p>Log in om de inhoud van de site te beheren.</p>
</section>

<section class="section" style="padding-top:0;">
    <div class="auth-card">
        <h2>Welkom terug</h2>
        <form action="{{ url_for('auth.login') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="username">Gebruikersnaam</label>
            <input id="username" type="text" name="username" class="login-input" placeholder="Voer uw gebruikersnaam in" required>

            <label for="password">Wachtwoord</label>
            <div class="password-field">
                <input id="password" type="password" name="password" class="login-input" placeholder="••••••••" required autocomplete="current-password">
                <button type="button" class="password-toggle" data-toggle-for="password" aria-label="Wachtwoord tonen" aria-pressed="false">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <button type="submit" class="btn-dark btn login-button">Inloggen</button>
        </form>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/password_toggle.js') }}" defer></script>
{% endblock %}
